services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_service_db,fast_food_service_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth-service:
    build: ./auth-service
    command: >
      sh -c "
        echo 'Waiting for postgres...'
        until python -c 'import socket; socket.create_connection((\"postgres\", 5432), timeout=1)' 2>/dev/null; do
          sleep 1
        done
        echo 'PostgreSQL started'
        python manage.py migrate
        python manage.py collectstatic --noinput
        gunicorn auth_service.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - ./auth-service:/app
      - auth-static:/app/staticfiles
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/auth_service_db
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=aurorabackend.fronteratech.ec,localhost,127.0.0.1,auth-service
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aurora-network
      - npm_default
    restart: on-failure

  fast-food-service:
    build: ./fast-food-service
    command: >
      sh -c "
        echo 'Waiting for postgres...'
        until python -c 'import socket; socket.create_connection((\"postgres\", 5432), timeout=1)' 2>/dev/null; do
          sleep 1
        done
        echo 'PostgreSQL started'
        python manage.py migrate
        python manage.py collectstatic --noinput
        gunicorn fast_food_service.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120
      "
    volumes:
      - ./fast-food-service:/app
      - fastfood-static:/app/staticfiles
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fast_food_service_db
      - AUTH_SERVICE_URL=http://auth-service:8000
      - ALLOWED_HOSTS=aurorabackend.fronteratech.ec,localhost,127.0.0.1,fast-food-service
      - DEBUG=False
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - aurora-network
      - npm_default
    restart: on-failure

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_BASE_URL=http://aurorabackend.fronteratech.ec
      - REACT_APP_AUTH_SERVICE=http://aurorabackend.fronteratech.ec/auth
      - REACT_APP_FAST_FOOD_SERVICE=http://aurorabackend.fronteratech.ec/fast-food
    networks:
      - aurora-network
      - npm_default
    restart: on-failure

networks:
  aurora-network:
    driver: bridge
  npm_default:
    external: true

volumes:
  postgres-data:
  auth-static:
  fastfood-static: