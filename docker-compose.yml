services:
  postgres:
    image: postgres:15
    container_name: aurora_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_service_db,fast_food_service_db,restaurant_service_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/create-multiple-postgresql-databases.sh:/docker-entrypoint-initdb.d/create-multiple-postgresql-databases.sh
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    mem_limit: 2g
    cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: aurora_redis
    networks:
      - aurora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.5'

  auth-service:
    build: ./auth-service
    container_name: aurora_auth_service
    command: >
      sh -c "
        echo 'Waiting for postgres...'
        until python -c 'import socket; socket.create_connection((\"postgres\", 5432), timeout=1)' 2>/dev/null; do
          sleep 1
        done
        echo 'PostgreSQL started'
        python manage.py migrate
        python manage.py collectstatic --noinput
        daphne -b 0.0.0.0 -p 8000 auth_service.asgi:application
      "
    volumes:
      - auth-static:/app/staticfiles
    environment:
      - SECRET_KEY=aurora-production-secret-key-2025-ultra-secure-change-this
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/auth_service_db
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=aurora.fronteratech.ec,146.190.217.68,localhost,auth-service,auth-service:8000
      - CORS_ALLOWED_ORIGINS=https://aurora.fronteratech.ec,http://146.190.217.68,http://localhost:3000
      - DEBUG=False
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aurora-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'

  fast-food-service:
    build: ./fast-food-service
    container_name: aurora_fastfood_service
    command: >
      sh -c "
        echo 'Waiting for postgres...'
        until python -c 'import socket; socket.create_connection((\"postgres\", 5432), timeout=1)' 2>/dev/null; do
          sleep 1
        done
        echo 'PostgreSQL started'
        python manage.py migrate
        python manage.py collectstatic --noinput
        daphne -b 0.0.0.0 -p 8000 fast_food_service.asgi:application
      "
    volumes:
      - fastfood-static:/app/staticfiles
      - fastfood-media:/app/media
    environment:
      - SECRET_KEY=aurora-production-secret-key-2025-ultra-secure-change-this
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fast_food_service_db
      - AUTH_SERVICE_URL=http://auth-service:8000/auth
      - ALLOWED_HOSTS=aurora.fronteratech.ec,146.190.217.68,localhost,auth-service,auth-service:8000
      - CORS_ALLOWED_ORIGINS=https://aurora.fronteratech.ec,http://146.190.217.68,http://localhost:3000
      - DEBUG=False
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - aurora-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'

  restaurant-service:
    build: ./restaurant-service
    container_name: aurora_restaurant_service
    command: >
      sh -c "
        echo 'Waiting for postgres...'
        until python -c 'import socket; socket.create_connection((\"postgres\", 5432), timeout=1)' 2>/dev/null; do
          sleep 1
        done
        echo 'PostgreSQL started'
        python manage.py migrate
        python manage.py collectstatic --noinput
        daphne -b 0.0.0.0 -p 8000 restaurant_service.asgi:application
      "
    volumes:
      - restaurant-static:/app/staticfiles
      - restaurant-media:/app/media
    environment:
      - SECRET_KEY=aurora-production-secret-key-2025-ultra-secure-change-this
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/restaurant_service_db
      - AUTH_SERVICE_URL=http://auth-service:8000/auth
      - ALLOWED_HOSTS=aurora.fronteratech.ec,146.190.217.68,localhost,127.0.0.1,auth-service,auth-service:8000
      - CORS_ALLOWED_ORIGINS=https://aurora.fronteratech.ec,http://146.190.217.68,http://localhost:3000
      - DEBUG=False
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - aurora-network
    restart: unless-stopped
    mem_limit: 512m
    cpus: '0.5'

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_BASE_URL=https://aurora.fronteratech.ec
        - REACT_APP_AUTH_SERVICE=https://aurora.fronteratech.ec
        - REACT_APP_FAST_FOOD_SERVICE=https://aurora.fronteratech.ec/api/fast-food
        - REACT_APP_RESTAURANT_SERVICE=https://aurora.fronteratech.ec
    container_name: aurora_frontend
    volumes:
      - /app/node_modules
    environment:
      - NODE_ENV=production
      - REACT_APP_API_BASE_URL=https://aurora.fronteratech.ec
      - REACT_APP_AUTH_SERVICE=https://aurora.fronteratech.ec
      - REACT_APP_FAST_FOOD_SERVICE=https://aurora.fronteratech.ec/api/fast-food
      - REACT_APP_RESTAURANT_SERVICE=https://aurora.fronteratech.ec
    expose:
      - "3000"
    networks:
      - aurora-network
    restart: unless-stopped
    mem_limit: 1g
    cpus: '0.5'

  nginx:
    image: nginx:alpine
    container_name: aurora_nginx
    ports:
      - "8090:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - auth-static:/usr/share/nginx/html/static/auth:ro
      - fastfood-static:/usr/share/nginx/html/static/fastfood:ro
      - fastfood-media:/usr/share/nginx/html/media:ro
      - restaurant-static:/usr/share/nginx/html/static/restaurant:ro
      - restaurant-media:/usr/share/nginx/html/restaurant/media:ro
    depends_on:
      - auth-service
      - fast-food-service
      - restaurant-service
      - frontend
    networks:
      - aurora-network
      - general-net
    restart: unless-stopped
    mem_limit: 128m
    cpus: '0.5'

networks:
  aurora-network:
    driver: bridge
    name: aurora_network
  general-net:
    external: true

volumes:
  postgres-data:
    name: aurora_postgres_data
  auth-static:
    name: aurora_auth_static
  fastfood-static:
    name: aurora_fastfood_static
  fastfood-media:
    name: aurora_fastfood_media
  restaurant-static:
    name: aurora_restaurant_static
  restaurant-media:
    name: aurora_restaurant_media
